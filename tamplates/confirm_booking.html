<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DIU Smart Transport | Booking Confirmed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: particleMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes particleMove {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 40px 40px;
            }
        }

        .container {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .confirmation-card {
            background: white;
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 35px 60px rgba(0,0,0,0.3);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(2px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-wrapper {
            margin-bottom: 1.5rem;
        }

        .success-circle {
            width: 110px;
            height: 110px;
            background: linear-gradient(145deg, #dcfce7, #bbf7d0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            animation: pulse 0.8s ease-in-out;
            box-shadow: 0 15px 30px rgba(34,197,94,0.3);
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-circle i {
            font-size: 4rem;
            color: #16a34a;
        }

        .checkmark {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 0.8s ease forwards 0.3s;
        }

        @keyframes drawCheck {
            to {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 2.2rem;
            color: #1e2a3e;
            margin: 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .subtitle {
            color: #5c6f87;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px dashed #ffb347;
            display: inline-block;
            padding-bottom: 0.3rem;
        }

        .booking-summary {
            background: linear-gradient(145deg, #f8fafc, #f1f5f9);
            border-radius: 1.8rem;
            padding: 1.5rem;
            margin: 1.8rem 0;
            text-align: left;
            border: 1px solid #e2e8f0;
        }

        .detail-row {
            display: flex;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-icon {
            width: 55px;
            height: 55px;
            background: #fff;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .detail-icon i {
            font-size: 1.5rem;
            color: #ffb347;
        }

        .detail-content {
            flex: 1;
        }

        .detail-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6c7e97;
            font-weight: 600;
        }

        .detail-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1e2a3e;
        }

        .seat-badge {
            background: linear-gradient(145deg, #ffb347, #ff9f1a);
            color: #1e2a3a;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            display: inline-block;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .qr-section {
            background: #fff;
            border-radius: 1.2rem;
            padding: 1rem;
            margin: 1.2rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border: 2px dashed #ffb347;
        }

        .qr-placeholder {
            width: 70px;
            height: 70px;
            background: repeating-linear-gradient(45deg, #1e2a3e, #1e2a3e 8px, #ffb347 8px, #ffb347 16px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
        }

        .qr-text {
            flex: 1;
            font-size: 0.7rem;
            color: #4b5563;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-primary {
            flex: 1;
            background: linear-gradient(145deg, #ffb347, #ff9f1a);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 3rem;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #1e2a3a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255,180,71,0.4);
        }

        .btn-secondary {
            flex: 1;
            background: #0a2d50;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 3rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-secondary:hover {
            background: #1e4a76;
            transform: translateY(-3px);
        }

        .footer-note {
            margin-top: 1.5rem;
            padding-top: 1rem;
            font-size: 0.7rem;
            color: #6c7e97;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-top: 1px solid #e2e8f0;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        @media (max-width: 550px) {
            body {
                padding: 1rem;
            }
            .confirmation-card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            .detail-value {
                font-size: 1rem;
            }
            .detail-icon {
                width: 45px;
                height: 45px;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="container">
    <div class="confirmation-card">
        <!-- Success Icon -->
        <div class="success-wrapper">
            <div class="success-circle">
                <i class="fas fa-check-circle"></i>
            </div>
        </div>

        <h1>
            <i class="fas fa-ticket-alt"></i> 
            Booking Confirmed !
            <i class="fas fa-party-horn"></i>
        </h1>
       

        
        <div class="booking-summary">
            <div class="detail-row">
                <div class="detail-icon">
                    <i class="fas fa-user-graduate"></i>
                </div>
                <div class="detail-content">
                    <div class="detail-label">Student ID</div>
                    <div class="detail-value">{{ student_id }}</div>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-icon">
                    <i class="fas fa-calendar-week"></i>
                </div>
                <div class="detail-content">
                    <div class="detail-label">Bus Schedule ID</div>
                    <div class="detail-value">{{ bus_schedule_id }}</div>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-icon">
                    <i class="fas fa-chair"></i>
                </div>
                <div class="detail-content">
                    <div class="detail-label">Seat Number</div>
                    <div class="detail-value">
                        <span class="seat-badge">
                            <i class="fas fa-tag"></i> Seat {{ seat_id }}
                        </span>
                    </div>
                </div>
            </div>
        </div>

    

        <!-- print-->
        <div class="button-group">
            <a href="/student_dashboard?student_id={{ student_id }}" class="btn-primary">
                <i class="fas fa-tachometer-alt"></i> Go to Dashboard
            </a>
            <button onclick="window.print();" class="btn-secondary">
                <i class="fas fa-print"></i> Print / Save  PDF
            </button>
        </div>

        <div class="footer-note">
            <i class="fas fa-bus"></i> Smart DIU Transport System
            
            <span>•</span>
            <i class="fas fa-smile"></i> Happy Journey!
        </div>
    </div>
</div>

<script>
    
    (function() {
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        let particles = [];
        let animationId = null;
        
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        function randomRange(min, max) {
            return Math.random() * (max - min) + min;
        }
        
        class ConfettiParticle {
            constructor() {
                this.x = randomRange(0, width);
                this.y = randomRange(-height, 0);
                this.size = randomRange(5, 12);
                this.speedY = randomRange(3, 8);
                this.speedX = randomRange(-2, 2);
                this.color = `hsl(${randomRange(30, 60)}, 80%, 55%)`; 
                this.rotation = randomRange(0, 360);
                this.rotationSpeed = randomRange(-5, 5);
            }
            
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotationSpeed;
                if (this.y > height + 50) {
                    this.y = -50;
                    this.x = randomRange(0, width);
                }
                if (this.x > width + 50) this.x = -50;
                if (this.x < -50) this.x = width + 50;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }
        
        function initConfetti() {
            for (let i = 0; i < 180; i++) {
                particles.push(new ConfettiParticle());
            }
            animate();
        }
        
        function animate() {
            if (!ctx) return;
            ctx.clearRect(0, 0, width, height);
            for (let p of particles) {
                p.update();
                p.draw();
            }
            animationId = requestAnimationFrame(animate);
        }
        
        function startConfetti(duration = 5000) {
            resizeCanvas();
            initConfetti();
            setTimeout(() => {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                    ctx.clearRect(0, 0, width, height);
                    particles = [];
                }
            }, duration);
        }
        
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (animationId) {
                ctx.clearRect(0, 0, width, height);
                particles = [];
                initConfetti();
            }
        });
        
        startConfetti(6000);
        
        function createFloatingEmoji() {
            const emojis = ['🎉', '🎊', '✨', '⭐', '🎈', '🚌', '💺', '✅', '🎫'];
            const emoji = document.createElement('div');
            emoji.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            emoji.style.position = 'fixed';
            emoji.style.fontSize = randomRange(24, 48) + 'px';
            emoji.style.left = randomRange(0, window.innerWidth) + 'px';
            emoji.style.top = window.innerHeight + 'px';
            emoji.style.opacity = '0.8';
            emoji.style.pointerEvents = 'none';
            emoji.style.zIndex = '999';
            emoji.style.animation = `floatUp ${randomRange(3, 6)}s ease-out forwards`;
            document.body.appendChild(emoji);
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes floatUp {
                    0% {
                        transform: translateY(0) rotate(0deg);
                        opacity: 1;
                    }
                    100% {
                        transform: translateY(-100vh) rotate(360deg);
                        opacity: 0;
                    }
                }
            `;
            if (!document.querySelector('#emoji-style')) {
                style.id = 'emoji-style';
                document.head.appendChild(style);
            }
            
            setTimeout(() => emoji.remove(), 5000);
        }
        
        for (let i = 0; i < 35; i++) {
            setTimeout(() => createFloatingEmoji(), i * 120);
        }
        
        console.log("🎉 Booking Confirmed .");
        
 
        const seatBadge = document.querySelector('.seat-badge');
        if (seatBadge) {
            seatBadge.style.animation = 'pulse 0.6s ease-in-out 3';
        }
        
        const toast = document.createElement('div');
        toast.innerHTML = '<i class="fas fa-check-circle"></i> Booking Successful ! Seat ' + '{{ seat_id }}' + ' is reserved.';
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '20px';
        toast.style.background = '#16a34a';
        toast.style.color = 'white';
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '50px';
        toast.style.fontWeight = 'bold';
        toast.style.zIndex = '1001';
        toast.style.boxShadow = '0 5px 15px rgba(0,0,0,0.2)';
        toast.style.animation = 'slideInLeft 0.4s ease';
        document.body.appendChild(toast);
        
        const styleToast = document.createElement('style');
        styleToast.textContent = `
            @keyframes slideInLeft {
                from {
                    transform: translateX(-100px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(styleToast);
        
        setTimeout(() => toast.remove(), 5000);
    })();
    
    window.onbeforeprint = function() {
        const canvas = document.getElementById('confetti-canvas');
        if (canvas) canvas.style.display = 'none';
    };
    window.onafterprint = function() {
        const canvas = document.getElementById('confetti-canvas');
        if (canvas) canvas.style.display = 'block';
    };
</script>

</body>
</html>
