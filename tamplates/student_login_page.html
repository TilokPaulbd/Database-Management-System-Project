<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>

<body>

<div class="container">
    <h2>Login Page</h2>

    <form action="/login" method="POST">

        <label>Student ID</label><br>
        <input type="text" name="student_id" placeholder="xxx-xx-xxx" required>

        <label>Password</label><br>
        <input type="password" name="student_password" placeholder="********" required>

        <button type="submit">Login</button>

    </form>
</div>

</body>
</html>
